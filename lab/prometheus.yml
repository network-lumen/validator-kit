global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "lumen-validator"
    static_configs:
      - targets:
          - "validator:26660"

  - job_name: "lumen-sentry"
    static_configs:
      - targets:
          - "sentry-a:26660"
          - "sentry-b:26660"

  # Node exporter (lab) – reuse the same exporter but present it
  # as if it were attached to each node instance, so dashboards
  # using node_*{instance="$instance"} work out of the box.
  - job_name: "node-validator"
    static_configs:
      - targets:
          - "lumen-node-exporter:9100"
    relabel_configs:
      - target_label: job
        replacement: "node"
      - target_label: instance
        replacement: "validator:26660"

  - job_name: "node-sentry-a"
    static_configs:
      - targets:
          - "lumen-node-exporter:9100"
    relabel_configs:
      - target_label: job
        replacement: "node"
      - target_label: instance
        replacement: "sentry-a:26660"

  - job_name: "node-sentry-b"
    static_configs:
      - targets:
          - "lumen-node-exporter:9100"
    relabel_configs:
      - target_label: job
        replacement: "node"
      - target_label: instance
        replacement: "sentry-b:26660"
