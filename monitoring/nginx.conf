server {
  listen 80 default_server;
  server_name _;

  # IP whitelist: allow only specific addresses/ranges.
  # Adjust these lines to your own admin IPs.
  allow 127.0.0.1;          # local access from the sentry host
  # allow 1.2.3.4;          # example: office IP
  # allow 5.6.7.0/24;       # example: CIDR range
  deny all;

  location / {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

