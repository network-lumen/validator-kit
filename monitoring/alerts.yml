groups:
  - name: lumen-validator.rules
    rules:
      - alert: ValidatorDown
        expr: up{job="lumen-validator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Validator is down"
          description: "The Lumen validator metrics endpoint is not responding."

      - alert: ValidatorBehindHead
        # Placeholder rule: adjust the metric names to match your chain.
        # Many Cosmos SDK chains expose a consensus height metric such as:
        #   tendermint_consensus_height
        # This rule assumes the validator is scraped as job='lumen-validator'.
        expr: |
          max(tendermint_consensus_height) - on() min(tendermint_consensus_height{job="lumen-validator"}) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Validator is lagging behind"
          description: "Validator consensus height is more than 5 blocks behind network head (adjust threshold as needed)."

  - name: host.rules
    rules:
      # Placeholder host alerts (require node_exporter or similar).
      - alert: HostHighCPU
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% on {{ $labels.instance }} (requires node_exporter)."

