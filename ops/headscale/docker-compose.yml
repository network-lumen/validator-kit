version: "3.9"

services:
  headscale:
    image: headscale/headscale:0.23.0
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./config:/etc/headscale
      - headscale-data:/var/lib/headscale
    ports:
      - "${HEADSCALE_PORT:-8080}:8080"
      - "${HEADSCALE_GRPC_PORT:-50443}:50443"
      - "${HEADSCALE_METRICS_PORT:-9090}:9090"

  headscale-proxy:
    image: nginx:alpine
    container_name: headscale-proxy
    restart: unless-stopped
    depends_on:
      - headscale
    profiles:
      - proxy
    ports:
      - "${HEADSCALE_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HEADSCALE_TLS_CERT_PATH:-./proxy/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${HEADSCALE_TLS_KEY_PATH:-./proxy/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro

volumes:
  headscale-data:
