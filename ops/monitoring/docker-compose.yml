version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: lumen-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Prometheus UI (optional, can be firewalled)
      - "${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: lumen-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/lumen-validator.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/lumen.yml:ro
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/lumen.yml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/json:ro
    expose:
      - "3000"

  grafana-proxy:
    image: nginx:alpine
    container_name: lumen-grafana-proxy
    restart: unless-stopped
    depends_on:
      - grafana
    ports:
      # Public HTTP entrypoint for Grafana dashboard
      - "${GRAFANA_HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  grafana-data:
